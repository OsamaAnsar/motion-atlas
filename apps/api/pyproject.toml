[project]
name = "motion-atlas-api"
version = "0.1.0"
description = "FastAPI gateway between Motion Atlas and ComfyUI / Wan 2.2."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "websockets>=13",
  "sqlmodel>=0.0.22",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["ruff>=0.7", "mypy>=1.11", "pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
