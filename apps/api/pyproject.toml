[project]
name = "motion-atlas-api"
version = "0.1.0"
description = "FastAPI gateway between Motion Atlas and ComfyUI / Wan 2.2."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "websockets>=13",
  "sqlmodel>=0.0.22",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["ruff>=0.7", "mypy>=1.11", "pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# `str, Enum` is intentional (stable JSON/`str()` behaviour vs. 3.11 StrEnum).
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "ASYNC109"]

[tool.mypy]
python_version = "3.11"
# Pragmatic, not --strict: catch real type errors without fighting FastAPI's
# `Depends(...)` defaults, dict literals, and lambda inference across the async code.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
